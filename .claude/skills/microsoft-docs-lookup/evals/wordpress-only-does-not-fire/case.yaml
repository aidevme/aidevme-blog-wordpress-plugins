schema_version: "1.1"
name: wordpress-only-does-not-fire
description: Negative case - an ordinary WordPress question must not load the Microsoft docs skill.
tags: [negative, smoke]
execution:
  max_turns: 5
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    How do I register a simple shortcode called [greeting] in a WordPress plugin that outputs "Hello"?
graders:
  - name: answers-the-question
    type: regex
    pattern: 'add_shortcode'
    target: last_message
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?microsoft-docs-lookup"'
    min: 0
    max: 0
    arm: both
