schema_version: "1.1"
name: offtopic-does-not-fire
description: Negative case - a question unrelated to plugin security should not load the security skill.
tags: [negative]
execution:
  max_turns: 5
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    In plain JavaScript, what's the simplest way to format today's date as YYYY-MM-DD?
graders:
  - name: answers-the-question
    type: llm
    criteria: |
      PASS if the response gives a working JavaScript way to format a date as YYYY-MM-DD (for example toISOString().slice(0, 10) or building it from getFullYear/getMonth/getDate).
      FAIL if it does not answer, or turns the answer into a WordPress security review.
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?wordpress-plugin-security-checklist"'
    min: 0
    max: 0
    arm: both
