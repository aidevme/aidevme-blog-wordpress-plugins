name: Build Credentials Manager Plugin

# Manual trigger only: Actions tab > "Build Credentials Manager Plugin" > Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Type-check, lint, build and package
    # Pinned (not ubuntu-latest) so the runner image doesn't change under this
    # workflow when GitHub migrates ubuntu-latest to Ubuntu 26 (from 2026-10-19).
    # Bump deliberately.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src/credentials-manager-plugin

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/credentials-manager-plugin/package-lock.json

      # `npm run lint-php` shells out to `php -l`, so it needs a PHP CLI.
      # 7.4 is the plugin's declared minimum ("Requires PHP" in the plugin
      # header), so linting with it also catches newer-than-7.4 syntax.
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          tools: none

      - name: Install dependencies
        run: npm ci

      - name: Type-check (tsc)
        run: npm run check-types

      - name: Lint PHP
        run: npm run lint-php

      # Deliberately `npx wp-scripts build`, not `npm run build`: the latter
      # fires the `prebuild` hook (bin/bump-version.js), which would bump the
      # patch version inside this throwaway checkout, so the zip would carry
      # a version number that was never committed. This builds exactly what
      # is in the repo.
      - name: Build (webpack)
        run: npx wp-scripts build

      # Same script the `postbuild` hook runs locally.
      - name: Package zip
        run: npm run package-zip

      - name: Read plugin version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: List zip contents
        run: unzip -l dist/credentials-manager-plugin.zip

      - name: Upload plugin zip
        uses: actions/upload-artifact@v7
        with:
          name: credentials-manager-plugin-${{ steps.version.outputs.version }}
          path: src/credentials-manager-plugin/dist/credentials-manager-plugin.zip
          if-no-files-found: error
