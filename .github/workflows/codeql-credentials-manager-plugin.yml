name: CodeQL - Credentials Manager Plugin

# Manual trigger only: Actions tab > "CodeQL - Credentials Manager Plugin" > Run workflow.
on:
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Required to upload results to the Security > Code scanning tab.
      security-events: write
      # Required to fetch the repository contents.
      contents: read
      # Required by github/codeql-action in private repositories; harmless here.
      actions: read

    strategy:
      fail-fast: false
      matrix:
        # CodeQL has no PHP support, so the plugin's PHP is not covered by
        # this workflow. javascript-typescript covers the .ts/.tsx sources and
        # the JS build scripts; actions covers the workflow files themselves.
        # Both are interpreted/declarative, so no build step is needed.
        include:
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # security-and-quality = the default security queries, plus the
          # extended security ones, plus maintainability/reliability queries.
          queries: security-and-quality
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
