name: Release Credentials Manager Plugin

# Manual trigger only, and only from the main branch: Actions tab > "Release
# Credentials Manager Plugin" > Run workflow, with "Use workflow from" set to
# main. Started from any other branch, the first step fails immediately with an
# explanatory error, before anything is checked out, built, or published.
#
# Builds the plugin from main exactly as committed (no version bump), then
# publishes a GitHub Release with the installable zip attached. The release is
# tagged credentials-manager-plugin-v<version> -- plugin-scoped, because this
# repository will hold more than one plugin -- where <version> is the version
# already committed in package.json. Bump it first (npm run build locally does
# this) and merge that to main.
on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: Mark the release as a pre-release (keep on while the plugin is 0.x)
        type: boolean
        default: true
      draft:
        description: Create the release as a draft, to review it before publishing
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release:
    name: Build and publish release
    # Pinned (not ubuntu-latest) so the runner image doesn't change under this
    # workflow when GitHub migrates ubuntu-latest to Ubuntu 26 (from 2026-10-19).
    # Bump deliberately.
    runs-on: ubuntu-24.04
    # Only this job needs to write: it creates the tag and the release.
    permissions:
      contents: write
    defaults:
      run:
        working-directory: src/credentials-manager-plugin

    steps:
      # First step, before checkout, so a release started from the wrong branch
      # fails at once with a clear message. A step that fails is used instead of
      # a job-level `if:` because a skipped job looks like a passing run, which
      # is easy to mistake for a release that actually happened. `github.ref` is
      # the branch chosen in the "Use workflow from" dropdown. The default
      # working directory doesn't exist until checkout, so override it here.
      - name: Require the main branch
        working-directory: ${{ github.workspace }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases can only be published from the main branch, but this run was started from '$GITHUB_REF_NAME'. Re-run the workflow with 'Use workflow from' set to main."
            exit 1
          fi
          echo "Releasing from main."

      - name: Check out repository
        uses: actions/checkout@v7

      # Fail fast, before any building, on a version that can't be released.
      - name: Read and validate version
        id: version
        run: |
          pkg=$(node -p "require('./package.json').version")
          header=$(sed -n 's/^ \* Version:[[:space:]]*//p' credentials-manager-plugin.php | head -n1 | tr -d '\r')
          define=$(sed -n "s/^define( 'CREDPL_VERSION', '\([^']*\)'.*/\1/p" credentials-manager-plugin.php | head -n1)

          echo "package.json: $pkg | plugin header: $header | CREDPL_VERSION: $define"

          if [ -z "$pkg" ] || [ "$pkg" != "$header" ] || [ "$pkg" != "$define" ]; then
            echo "::error::Version mismatch (package.json '$pkg', plugin header '$header', CREDPL_VERSION '$define'). They must all match; run 'npm run build' locally to keep them in sync."
            exit 1
          fi

          if ! printf '%s' "$pkg" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version '$pkg' is not in X.Y.Z form."
            exit 1
          fi

          tag="credentials-manager-plugin-v$pkg"

          # A release must never silently reuse or move an existing tag.
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "::error::Tag '$tag' already exists. Bump the plugin version (npm run build) and merge it, then run this workflow again."
            exit 1
          fi

          {
            echo "version=$pkg"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/credentials-manager-plugin/package-lock.json

      # `npm run lint-php` shells out to `php -l`. 7.4 is the plugin's declared
      # minimum ("Requires PHP" in the plugin header), so linting with it also
      # catches newer-than-7.4 syntax.
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          tools: none

      - name: Install dependencies
        run: npm ci

      - name: Type-check (tsc)
        run: npm run check-types

      - name: Lint PHP
        run: npm run lint-php

      # Deliberately `npx wp-scripts build`, not `npm run build`: the latter
      # fires the `prebuild` hook (bin/bump-version.js), which would bump the
      # version inside this throwaway checkout, so the zip would no longer match
      # the tag that is about to be created.
      - name: Build (webpack)
        run: npx wp-scripts build

      - name: Package zip
        run: npm run package-zip

      - name: Verify zip contents
        run: |
          zip=dist/credentials-manager-plugin.zip
          listing=$(unzip -Z1 "$zip")

          for required in \
            credentials-manager-plugin/credentials-manager-plugin.php \
            credentials-manager-plugin/uninstall.php \
            credentials-manager-plugin/includes/class-credpl-installer.php; do
            echo "$listing" | grep -qx "$required" || { echo "::error::Zip is missing $required"; exit 1; }
          done

          js_count=$(echo "$listing" | grep -c '^credentials-manager-plugin/build/.*\.js$' || true)
          if [ "$js_count" -lt 1 ]; then
            echo "::error::Zip contains no compiled build/*.js files"
            exit 1
          fi

          # Dev-only files must never ship.
          if echo "$listing" | grep -Eq '/(node_modules|src|bin)/|/(package\.json|tsconfig\.json|webpack\.config\.js)$'; then
            echo "::error::Zip contains development-only files"
            exit 1
          fi

          echo "OK: $(echo "$listing" | wc -l) entries, $js_count compiled scripts"

      - name: Create GitHub release
        run: |
          asset="credentials-manager-plugin-$VERSION.zip"
          cp dist/credentials-manager-plugin.zip "$asset"

          requires_wp=$(sed -n 's/^ \* Requires at least:[[:space:]]*//p' credentials-manager-plugin.php | head -n1 | tr -d '\r')
          requires_php=$(sed -n 's/^ \* Requires PHP:[[:space:]]*//p' credentials-manager-plugin.php | head -n1 | tr -d '\r')

          {
            printf 'Installable WordPress plugin zip for Credentials Manager %s.\n\n' "$VERSION"
            printf 'Install: in WordPress go to Plugins > Add New > Upload Plugin, choose %s, then Install Now and Activate.\n\n' "$asset"
            printf 'Requires WordPress %s or later and PHP %s or later.\n\n' "$requires_wp" "$requires_php"
            printf 'Full version history: https://github.com/%s/blob/%s/src/credentials-manager-plugin/CHANGE_LOG.md\n' "$GITHUB_REPOSITORY" "$TAG"
          } > release-notes.md

          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          if [ "$DRAFT" = "true" ]; then flags+=(--draft); fi

          # --generate-notes appends GitHub's auto-generated "What's Changed" list
          # of merged pull requests after the intro above. It covers the whole
          # repository, not only this plugin, so it can include changes to other
          # plugins later on.
          gh release create "$TAG" "$asset" \
            --title "Credentials Manager $VERSION" \
            --notes-file release-notes.md \
            --generate-notes \
            --target "$GITHUB_SHA" \
            "${flags[@]}"

          {
            echo "### Released Credentials Manager $VERSION"
            echo
            echo "- Tag: \`$TAG\`"
            echo "- Commit: \`$GITHUB_SHA\` (branch \`$GITHUB_REF_NAME\`)"
            echo "- Pre-release: $PRERELEASE | Draft: $DRAFT"
            echo "- Asset: \`$asset\`"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
          DRAFT: ${{ inputs.draft }}
