name: Validate Agent Skill(s)

on:
  push:
    branches: [main, dev]
    paths:
      - "**/SKILL.md"
  pull_request:
    branches: [main, dev]
    paths:
      - "**/SKILL.md"
  workflow_dispatch:
    inputs:
      skill:
        description: "Skill to validate: a name (e.g. changelog-entry) or a path (e.g. .claude/skills/changelog-entry). Leave empty to validate every skill."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: validate-skill-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-slim
    if: github.event.pull_request.draft != true && github.actor != 'dependabot[bot]'
    outputs:
      skills: ${{ steps.changed-skills.outputs.skills }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get changed skills
        id: changed-skills
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
          INPUT_SKILL: ${{ github.event.inputs.skill }}
        run: |
          # Manual run: validate the named skill, or every skill when none is given.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -n "$INPUT_SKILL" ]; then
              case "$INPUT_SKILL" in
                *..*) echo "::error::The skill input must not contain '..'"; exit 1 ;;
              esac
              SKILL_PATH="${INPUT_SKILL%/}"
              if [ -f ".claude/skills/$SKILL_PATH/SKILL.md" ]; then
                SKILL_PATH=".claude/skills/$SKILL_PATH"
              elif [ ! -f "$SKILL_PATH/SKILL.md" ]; then
                echo "::error::No SKILL.md found for '$INPUT_SKILL' (looked in .claude/skills/$SKILL_PATH and $SKILL_PATH)"
                exit 1
              fi
              SKILLS=$(printf '%s\n' "$SKILL_PATH" | jq -R -s -c 'split("\n") | map(select(length > 0))')
            else
              SKILLS=$(find . -name SKILL.md -not -path '*/node_modules/*' -not -path './.git/*' | \
                sed 's|^\./||' | xargs -r -I {} dirname {} | sort -u | \
                jq -R -s -c 'split("\n") | map(select(length > 0))')
            fi
            echo "skills=$SKILLS" >> "$GITHUB_OUTPUT"
            echo "Skills to validate: $SKILLS"
            exit 0
          fi

          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE"
            HEAD="$PR_HEAD"
          else
            BASE="$PUSH_BEFORE"
            HEAD="$PUSH_AFTER"
          fi

          # A new branch or a force push has no usable "before" commit
          # (all zeros or missing from the clone); fall back to the parent
          # of the pushed commit so the diff still works.
          if [ -z "$BASE" ] || echo "$BASE" | grep -Eq '^0+$' || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE="$HEAD~1"
          fi

          # --diff-filter=d skips deleted files, so a removed SKILL.md does not
          # put a folder that no longer exists into the validation matrix.
          SKILLS=$(git diff --name-only --diff-filter=d "$BASE" "$HEAD" | \
            grep 'SKILL.md$' | \
            xargs -r -I {} dirname {} | \
            sort -u | \
            jq -R -s -c 'split("\n") | map(select(length > 0))')

          echo "skills=$SKILLS" >> "$GITHUB_OUTPUT"
          echo "Changed skills: $SKILLS"

  validate:
    needs: detect-changes
    if: needs.detect-changes.outputs.skills != '[]' && needs.detect-changes.outputs.skills != ''
    runs-on: ubuntu-slim
    strategy:
      fail-fast: false
      matrix:
        skill: ${{ fromJson(needs.detect-changes.outputs.skills) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate ${{ matrix.skill }}
        # Pinned to the commit behind tag v1.0.0 (third-party action).
        uses: Flash-Brew-Digital/validate-skill@39c9da973b7ce3fd4d9632672a0c355bdd733d89
        with:
          path: ${{ matrix.skill }}
